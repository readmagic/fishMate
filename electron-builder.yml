appId: com.frandy.fishMate
productName: fishMate
copyright: Copyright © Frandy
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# better-sqlite3 的 .node 原生二进制无法从 asar 内加载，必须解包
asarUnpack:
  - '**/better-sqlite3/**'
  - '**/better-sqlite3/*'
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Frandy
# 打包时跳过 node_modules 重装，使用已构建产物
nodeGypRebuild: false
